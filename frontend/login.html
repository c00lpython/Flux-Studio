<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Studio - Вход</title>
    <style>
        :root { --bg-dark: #1e1e1e; --bg-panel: #252526; --border-color: #3e3e42; --text-main: #cccccc; --accent-blue: #007acc; --gradient-main: linear-gradient(135deg, #007acc, #8b5cf6); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #111; color: var(--text-main); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-container { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 40px; width: 400px; max-width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .auth-container h1 { font-size: 24px; font-weight: 300; margin-bottom: 8px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-container p.subtitle { color: #969696; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; text-transform: uppercase; color: #969696; margin-bottom: 4px; }
        .form-group input { width: 100%; background: #1e1e1e; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(0,122,204,0.1); }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 40px; }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #969696;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: all 0.2s;
        }
        .password-toggle:hover { color: #fff; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s; background: var(--gradient-main); color: #fff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,122,204,0.3); }
        .auth-link { text-align: center; margin-top: 16px; font-size: 14px; color: #969696; }
        .auth-link a { color: var(--accent-blue); text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #2d2d2d; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.4s; z-index: 1000; max-width: 400px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: #27c93f; }
        .toast.error { border-color: #e81123; }
        .home-link { position: fixed; top: 20px; left: 20px; color: #969696; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .home-link:hover { color: #fff; }
    </style>
</head>
<body>
    <a href="/" class="home-link">🏠 На главную</a>
    
    <div class="auth-container">
        <h1>✦ Flux Studio</h1>
        <p class="subtitle">Войдите в аккаунт</p>
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="username" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')" id="toggleBtn2">
                        👁️
                    </button>
                </div>
            </div>
            <button type="submit" class="btn" onclick="login()">Войти</button>
        </form>
        <div class="auth-link">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
    
    <div class="toast" id="toast">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <script>
        // --- Toggle Password ---
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById('toggleBtn2');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // --- Toast ---
        function showToast(title, message, type) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // --- Login ---
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showToast('Ошибка', 'Заполните все поля', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('📡 Response:', data);
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user_id,
                        username: data.username,
                        role: data.role
                    }));
                    
                    showToast('✅', 'Вход выполнен!', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showToast('Ошибка', data.detail || 'Неверный логин или пароль', 'error');
                }
            } catch (e) {
                console.error('❌ Error:', e);
                showToast('Ошибка', 'Сервер недоступен', 'error');
            }
        }

        // --- Enter ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
