<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Studio - Load Project</title>
    
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-dot: #3e3e42;
            --border-color: #3e3e42;
            --text-main: #cccccc;
            --accent-blue: #007acc;
            --accent-purple: #8b5cf6;
            --gradient-main: linear-gradient(135deg, #007acc, #8b5cf6);
            --success-green: #27c93f;
            --warning-yellow: #ffbd2e;
            --danger-red: #e81123;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background-color: #111;
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }

        .app-window {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1e1e1e, #2d2d2d);
            padding: 0 15px;
            height: 36px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            flex-shrink: 0;
            z-index: 10;
        }
        .top-left { 
            display: flex; 
            align-items: center;
            flex: 1;
            gap: 15px;
        }
        .brand { 
            font-weight: 700; 
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex-shrink: 0;
            font-size: 15px;
            cursor: pointer;
        }
        .brand:hover {
            opacity: 0.8;
        }
        .menu-item { 
            cursor: pointer; 
            flex-shrink: 0;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 12px;
            color: #969696;
            position: relative;
        }
        .menu-item:hover { 
            color: #fff; 
            background: #2a2d2e;
        }
        .menu-item.active {
            color: #fff;
            background: #2a2d2e;
        }
        .menu-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--gradient-main);
            border-radius: 2px;
        }

        .search-bar {
            background: #3c3c3c;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 2px 12px;
            height: 26px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #969696;
            font-size: 12px;
            flex: 1;
            min-width: 100px;
            max-width: 400px;
            cursor: text;
            transition: all 0.3s;
        }
        .search-bar:hover { border-color: #555; background: #3a3a3a; }
        .search-bar:focus-within { 
            border-color: var(--accent-blue); 
            background: #252526; 
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.1);
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 12px;
            font-family: inherit;
        }
        .search-bar input::placeholder { color: #888; }
        .search-shortcut {
            font-size: 10px;
            color: #555;
            background: #2a2d2e;
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid #3e3e42;
        }

        .top-right { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            font-size: 14px; 
            flex-shrink: 0;
            color: #969696;
        }
        .top-right .icon-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-right .icon-btn:hover {
            background: #2a2d2e;
            color: #fff;
        }
        .window-controls {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }
        .window-controls span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
        }
        .window-controls .red { background: #ff5f56; }
        .window-controls .yellow { background: #ffbd2e; }
        .window-controls .green { background: #27c93f; }

        /* --- PROGRESS BAR --- */
        .progress-bar {
            height: 20px;
            background: #2d2d2d;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #555;
            flex-shrink: 0;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--gradient-main);
            opacity: 0.15;
            transition: width 1s;
        }
        .progress-bar .progress-label {
            position: relative;
            z-index: 1;
            background: rgba(45, 45, 45, 0.7);
            padding: 0 15px;
            border-radius: 10px;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background: radial-gradient(circle at 50% 50%, #1a1a1a, #0a0a0a);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .main-content::-webkit-scrollbar {
            width: 8px;
        }
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 4px;
        }
        .main-content::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }

        .project-loader-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin: auto;
        }

        .loader-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .loader-header .icon {
            font-size: 32px;
            width: 60px;
            height: 60px;
            background: var(--gradient-main);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .loader-header .title {
            font-size: 24px;
            font-weight: 300;
            color: #fff;
        }

        .loader-header .subtitle {
            font-size: 13px;
            color: #969696;
            margin-top: 4px;
        }

        /* Search & Filter */
        .search-filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            background: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 122, 204, 0.1);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 13px;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #555;
        }

        .search-box .clear-btn {
            cursor: pointer;
            color: #555;
            font-size: 14px;
            display: none;
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        .search-box .clear-btn:hover {
            color: #fff;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #969696;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .filter-btn:hover {
            background: #2a2d2e;
            color: #fff;
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Project List */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .project-list::-webkit-scrollbar {
            width: 6px;
        }
        .project-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .project-list::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 3px;
        }
        .project-list::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }

        .project-item {
            background: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .project-item:hover {
            border-color: #4a4a4a;
            transform: translateX(4px);
            background: #252526;
        }

        .project-item.selected {
            border-color: var(--accent-blue);
            background: #1a2a3a;
            box-shadow: 0 0 30px rgba(0, 122, 204, 0.1);
        }

        .project-item .project-info {
            flex: 1;
            min-width: 0;
        }

        .project-item .project-name {
            font-size: 15px;
            color: #fff;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .project-item .project-name .emoji {
            font-size: 20px;
        }

        .project-item .project-meta {
            display: flex;
            gap: 16px;
            margin-top: 4px;
            font-size: 12px;
            color: #969696;
            flex-wrap: wrap;
        }

        .project-item .project-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .project-item .project-meta .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .project-item .project-meta .dot.recent {
            background: var(--success-green);
        }
        .project-item .project-meta .dot.archived {
            background: var(--danger-red);
        }
        .project-item .project-meta .dot.draft {
            background: var(--warning-yellow);
        }

        .project-item .project-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .project-item .project-actions .action-btn {
            background: transparent;
            border: none;
            color: #969696;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 16px;
        }

        .project-item .project-actions .action-btn:hover {
            background: #2a2d2e;
            color: #fff;
        }

        .project-item .project-actions .action-btn.delete:hover {
            color: var(--danger-red);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #969696;
        }

        .empty-state .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .empty-state .title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state .desc {
            font-size: 14px;
            color: #555;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: transparent;
            color: #969696;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #2a2d2e;
            color: #fff;
        }

        .btn-primary {
            background: var(--gradient-main);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 122, 204, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2d2d2d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .toast-title {
            font-weight: 600;
            color: #fff;
            font-size: 14px;
        }

        .toast .toast-message {
            font-size: 13px;
            color: #969696;
            margin-top: 4px;
        }

        .toast.success { border-color: var(--success-green); }
        .toast.error { border-color: var(--danger-red); }
        .toast.warning { border-color: var(--warning-yellow); }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 20px 10px;
            }

            .project-loader-container {
                padding: 20px;
                margin: 10px 0;
            }

            .project-item {
                flex-direction: column;
                align-items: stretch;
            }

            .project-item .project-actions {
                justify-content: flex-end;
                margin-top: 8px;
            }

            .search-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-buttons {
                justify-content: center;
            }

            .loader-header .title {
                font-size: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .loader-header .icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .top-left .menu-item {
                display: none;
            }

            .project-item .project-meta {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

<div class="app-window">
    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-left">
            <div class="brand" onclick="window.location.href='/'">✦ Flux Studio</div>
            <div class="menu-item" onclick="window.location.href='/'">Home</div>
            <div class="menu-item" onclick="window.location.href='/create'">New Project</div>
            <div class="menu-item active" onclick="window.location.href='/load'">Load Project</div>
            <div class="menu-item" onclick="window.location.href='/editor'">Editor</div>
            <div class="menu-item" onclick="window.location.href='/admin'">Admin</div>
            
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="Global Search..." id="globalSearch">
                <span class="search-shortcut">⌘P</span>
            </div>

            <div class="menu-item">Help</div>
        </div>
        <div class="top-right">
            <span class="icon-btn" onclick="window.location.href='/'">🏠</span>
            <span class="icon-btn" onclick="window.location.href='/admin'">⚙️</span>
            <div class="window-controls">
                <span class="red" onclick="window.close()"></span>
                <span class="yellow"></span>
                <span class="green"></span>
            </div>
        </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-label" id="progressLabel">● Ready</span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        <div class="project-loader-container">
            <!-- Header -->
            <div class="loader-header">
                <div class="icon">📂</div>
                <div>
                    <div class="title">Load Project</div>
                    <div class="subtitle">Select a project to continue working</div>
                </div>
            </div>

            <!-- Search & Filter -->
            <div class="search-filter-bar">
                <div class="search-box">
                    <span>🔍</span>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search projects..."
                    >
                    <span class="clear-btn" id="searchClear">✕</span>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="recent">Recent</button>
                    <button class="filter-btn" data-filter="draft">Drafts</button>
                    <button class="filter-btn" data-filter="archived">Archived</button>
                </div>
            </div>

            <!-- Project List -->
            <div class="project-list" id="projectList">
                <!-- Загружается через JS -->
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">
                    Cancel
                </button>
                <button type="button" class="btn btn-secondary" id="refreshBtn">
                    🔄 Refresh
                </button>
                <button type="button" class="btn btn-primary" id="loadBtn" disabled>
                    📂 Load Project
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-title" id="toastTitle">Success!</div>
        <div class="toast-message" id="toastMessage">Project loaded successfully.</div>
    </div>
</div>

<script>
    // ============================================================
    //  LOAD PROJECT - РАБОЧАЯ ВЕРСИЯ С РЕАЛЬНЫМИ ЗАПРОСАМИ
    // ============================================================

    let projects = [];
    let selectedProjectId = null;
    let currentFilter = 'all';
    let searchQuery = '';

    // --- Progress Bar Animation ---
    let progress = 0;
    setInterval(() => {
        progress = (progress + 1) % 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressLabel').textContent = progress === 0 ? '● Ready' : `● Processing... ${progress}%`;
    }, 500);

    // --- Toast ---
    function showToast(title, message, type = 'success') {
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastMessage = document.getElementById('toastMessage');
        
        toast.className = 'toast ' + type;
        toastTitle.textContent = title;
        toastMessage.textContent = message;
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // --- Загрузка проектов с сервера ---
    async function loadProjects() {
        try {
            const response = await fetch('/api/projects');
            const data = await response.json();
            projects = data;
            renderProjects();
            console.log('📦 Loaded projects:', projects.length);
        } catch (error) {
            console.error('❌ Failed to load projects:', error);
            projects = [];
            renderProjects();
            showToast('Error', 'Failed to load projects.', 'error');
        }
    }

    // --- Рендер проектов ---
    function renderProjects() {
        const container = document.getElementById('projectList');
        
        let filtered = projects.filter(p => {
            // Фильтр по статусу
            if (currentFilter !== 'all') {
                const status = p.meta?.status || 'draft';
                if (status !== currentFilter) return false;
            }
            // Поиск
            if (searchQuery) {
                const name = (p.name || '').toLowerCase();
                const desc = (p.meta?.description || '').toLowerCase();
                if (!name.includes(searchQuery) && !desc.includes(searchQuery)) {
                    return false;
                }
            }
            return true;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">📭</span>
                    <div class="title">No projects found</div>
                    <div class="desc">
                        ${searchQuery ? 'Try adjusting your search or filters' : 'Create your first project to get started'}
                    </div>
                </div>
            `;
            document.getElementById('loadBtn').disabled = true;
            return;
        }

        container.innerHTML = filtered.map(project => `
            <div class="project-item ${selectedProjectId === project.id ? 'selected' : ''}" 
                 data-id="${project.id}"
                 onclick="selectProject('${project.id}')">
                <div class="project-info">
                    <div class="project-name">
                        <span class="emoji">${project.emoji || '📄'}</span>
                        ${project.name || 'Unnamed Project'}
                    </div>
                    <div class="project-meta">
                        <span>${project.meta?.description || 'No description'}</span>
                        <span>•</span>
                        <span>${project.meta?.framework || 'Vanilla JS'}</span>
                        <span>•</span>
                        <span>${formatDate(project.updated_at || project.created_at)}</span>
                        <span>•</span>
                        <span>
                            <span class="dot ${project.meta?.status || 'draft'}"></span>
                            ${capitalize(project.meta?.status || 'draft')}
                        </span>
                    </div>
                </div>
                <div class="project-actions">
                    <button class="action-btn delete" onclick="event.stopPropagation(); deleteProject('${project.id}')" title="Delete">
                        🗑️
                    </button>
                </div>
            </div>
        `).join('');

        document.getElementById('loadBtn').disabled = !selectedProjectId;
    }

    // --- Select Project ---
    function selectProject(id) {
        selectedProjectId = id;
        renderProjects();
        console.log('📌 Selected project:', id);
    }

    // --- Load Project ---
    async function loadProject() {
        if (!selectedProjectId) {
            showToast('Warning', 'Please select a project first.', 'warning');
            return;
        }

        const btn = document.getElementById('loadBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Loading...';

        try {
            const response = await fetch(`/api/project/${selectedProjectId}`);
            if (!response.ok) {
                throw new Error('Project not found');
            }
            const project = await response.json();
            
            showToast('✅ Loaded!', `Project "${project.projectName || 'Project'}" is ready.`, 'success');
            
            setTimeout(() => {
                window.location.href = `/project/${selectedProjectId}`;
            }, 1000);
        } catch (error) {
            console.error('❌ Failed to load project:', error);
            showToast('Error', 'Failed to load project. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = '📂 Load Project';
        }
    }

    // --- Delete Project ---
    async function deleteProject(id) {
        if (!confirm('Are you sure you want to delete this project?')) return;

        try {
            const response = await fetch(`/api/project/${id}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                throw new Error('Failed to delete');
            }
            
            projects = projects.filter(p => p.id !== id);
            if (selectedProjectId === id) selectedProjectId = null;
            renderProjects();
            showToast('Deleted', 'Project has been removed.', 'warning');
        } catch (error) {
            console.error('❌ Failed to delete project:', error);
            showToast('Error', 'Failed to delete project.', 'error');
        }
    }

    // --- Refresh ---
    async function refreshProjects() {
        await loadProjects();
        showToast('✅', 'Projects refreshed!', 'success');
    }

    // --- Helpers ---
    function formatDate(dateString) {
        if (!dateString) return 'Unknown';
        const date = new Date(dateString);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 3600000) return 'Just now';
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
        if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // --- Search ---
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    searchInput.addEventListener('input', function() {
        searchQuery = this.value.toLowerCase().trim();
        searchClear.classList.toggle('visible', this.value.length > 0);
        renderProjects();
    });

    searchClear.addEventListener('click', function() {
        searchInput.value = '';
        searchQuery = '';
        searchClear.classList.remove('visible');
        renderProjects();
        searchInput.focus();
    });

    // --- Filters ---
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderProjects();
        });
    });

    // --- Event Listeners ---
    document.getElementById('loadBtn').addEventListener('click', loadProject);
    document.getElementById('refreshBtn').addEventListener('click', refreshProjects);

    // --- Keyboard Shortcuts ---
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            loadProject();
        }
        if (e.key === 'Escape') {
            if (selectedProjectId) {
                selectedProjectId = null;
                renderProjects();
                document.getElementById('loadBtn').disabled = true;
            } else {
                window.location.href = '/';
            }
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            const items = document.querySelectorAll('.project-item');
            if (items.length === 0) return;
            
            let currentIndex = -1;
            items.forEach((item, index) => {
                if (item.classList.contains('selected')) currentIndex = index;
            });

            let newIndex;
            if (e.key === 'ArrowDown') {
                newIndex = Math.min(currentIndex + 1, items.length - 1);
            } else {
                newIndex = Math.max(currentIndex - 1, 0);
            }

            if (currentIndex === -1) newIndex = 0;
            
            const targetId = items[newIndex].dataset.id;
            selectProject(targetId);
            items[newIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    });

    // --- Init ---
    loadProjects();

    console.log('📂 Flux Studio - Project Loader');
    console.log('📡 Loading projects from /api/projects');
    console.log('💡 Keyboard shortcuts:');
    console.log('   • Ctrl+Enter - Load selected project');
    console.log('   • Escape - Deselect / Cancel');
    console.log('   • Arrow Up/Down - Navigate projects');
</script>

</body>
</html>
